# Build the documentation site on push to main, and publish it when a deploy key
# is configured. No `uses:` steps — see registry-images.yml for why.
#
# Secrets: DEPLOY_SSH_KEY (private key), DEPLOY_HOST
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".gitea/workflows/docs.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # SERVER is the runner's internal address (http://gitea:3000 on this
          # Gitea, https://host elsewhere). Keep its scheme: hardcoding https
          # against the HTTP port fails the TLS handshake.
          proto="${SERVER%%://*}"
          host="${SERVER#*://}"; host="${host%/}"
          git -c http.sslVerify=false clone --depth 1 \
            "${proto}://oauth2:${TOKEN}@${host}/${REPO}.git" src

      - name: build
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          NPM_REGISTRY: https://registry.npmmirror.com
          npm_config_replace_registry_host: always
        run: |
          set -eu
          # The runner image carries no node. Rather than depend on what it has,
          # build inside a node container from our own registry — the same reason
          # the image builds use sandrpod-base/* (Docker Hub is unreachable here).
          if command -v node >/dev/null 2>&1; then
            echo "using the runner's node $(node --version)"
            cd src/docs-site
            npm ci --no-audit --no-fund --registry="$NPM_REGISTRY"
            npm run build
          else
            echo "no node on the runner; building in sandrpod-base/node:22-alpine"
            if [ -n "${REGISTRY_HOST:-}" ]; then
              printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
            fi
            docker run --rm \
              -v "$PWD/src/docs-site:/w" -w /w \
              -e npm_config_registry="$NPM_REGISTRY" \
              -e npm_config_replace_registry_host=always \
              "${REGISTRY_HOST:-local}/sandrpod-base/node:22-alpine" \
              sh -c "npm ci --no-audit --no-fund && npm run build"
          fi
          test -f src/docs-site/.vitepress/dist/index.html

      - name: deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST:-}" ]; then
            echo "DEPLOY_SSH_KEY/DEPLOY_HOST unset — build-only run"
            exit 0
          fi
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete src/docs-site/.vitepress/dist/ "root@$HOST:/var/www/docs/"
