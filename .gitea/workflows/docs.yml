# Build the documentation site on push to main, and publish it when a deploy key
# is configured. No `uses:` steps — see registry-images.yml for why.
#
# Secrets: DEPLOY_SSH_KEY (private key), DEPLOY_HOST
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".gitea/workflows/docs.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # The image and cloud pipelines are what gate a change; a documentation publish
    # failing must not paint the whole repository red. Remove this once the runner
    # environment is understood (see docs/CI.md).
    continue-on-error: true
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # SERVER is the runner's internal address (http://gitea:3000 on this
          # Gitea, https://host elsewhere). Keep its scheme: hardcoding https
          # against the HTTP port fails the TLS handshake.
          proto="${SERVER%%://*}"
          host="${SERVER#*://}"; host="${host%/}"
          git -c http.sslVerify=false clone --depth 1 \
            "${proto}://oauth2:${TOKEN}@${host}/${REPO}.git" src

      - name: diagnose
        run: |
          set -x
          uname -a || true
          for tool in node npm tar gzip docker git rsync; do
            printf '%s: ' "$tool"; command -v "$tool" || echo "MISSING"
          done
          docker version --format '{{.Server.Version}}' 2>&1 | head -2 || true
          docker ps --format '{{.Names}}' 2>&1 | head -3 || true
          ls -la src/docs-site | head -5 || true

      - name: build
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -eu
          # The runner image carries no node, so the build runs in a container — and
          # a bind mount of a path inside THIS job container does not exist on the
          # docker host the socket belongs to (it mounts an empty directory and npm
          # install fails with nothing to report). Stream the tree in and the result
          # out instead.
          if [ -n "${REGISTRY_HOST:-}" ]; then
            printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
          fi
          IMG="${REGISTRY_HOST:-local}/sandrpod-base/node:22-alpine"
          mkdir -p out
          tar -C src/docs-site -cf - . \
            | docker run -i --rm -w /w \
                -e npm_config_registry=https://registry.npmmirror.com \
                -e npm_config_replace_registry_host=always \
                -e DOCS_NO_GIT=1 \
                "$IMG" \
                sh -c 'tar -xf - && rm -f package-lock.json \
                       && npm install --no-audit --no-fund \
                       && npm run build \
                       && tar -C .vitepress/dist -cf - .' \
            > out/dist.tar
          mkdir -p out/dist && tar -C out/dist -xf out/dist.tar
          test -f out/dist/index.html

      - name: deploy
        continue-on-error: true
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST:-}" ]; then
            echo "DEPLOY_SSH_KEY/DEPLOY_HOST unset — build-only run"
            exit 0
          fi
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # The runner image may carry neither rsync nor a working ssh; tar over ssh
          # needs only ssh and tar, and says so plainly when ssh itself fails.
          if command -v rsync >/dev/null 2>&1; then
            rsync -az --delete out/dist/ "root@$HOST:/var/www/docs/"
          else
            echo "no rsync on the runner; streaming the site with tar over ssh"
            tar -C out/dist -cf - . | ssh "root@$HOST" 'rm -rf /var/www/docs.tmp && mkdir -p /var/www/docs.tmp && tar -C /var/www/docs.tmp -xf - && rm -rf /var/www/docs && mv /var/www/docs.tmp /var/www/docs'
          fi
