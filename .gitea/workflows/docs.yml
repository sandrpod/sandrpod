# Build the documentation site on push to main, and publish it when a deploy key
# is configured. No `uses:` steps — see registry-images.yml for why.
#
# Secrets: DEPLOY_SSH_KEY (private key), DEPLOY_HOST
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs-site/**"
      - ".gitea/workflows/docs.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          host="${SERVER#https://}"; host="${host#http://}"
          git -c http.sslVerify=false clone --depth 1 \
            "https://oauth2:${TOKEN}@${host}/${REPO}.git" src

      - name: build
        run: |
          set -eu
          cd src/docs-site
          node --version || { echo "node missing on the runner image"; exit 1; }
          npm ci --no-audit --no-fund
          npm run build
          test -f .vitepress/dist/index.html

      - name: deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          set -eu
          if [ -z "${SSH_KEY:-}" ] || [ -z "${HOST:-}" ]; then
            echo "DEPLOY_SSH_KEY/DEPLOY_HOST unset — build-only run"
            exit 0
          fi
          mkdir -p ~/.ssh && printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          rsync -az --delete src/docs-site/.vitepress/dist/ "root@$HOST:/var/www/docs/"
