# Build the runtime images on every push to main and publish them to the
# platform's own registry.
#
# No `uses:` steps on purpose: this Gitea's runner cannot reach github.com, and a
# `uses: actions/...@vN` step makes it try to clone the action from the Gitea host,
# which answers 401 for actions it does not mirror — the whole job dies before the
# first command. The clone below is the replacement and works on GitHub too.
#
# Secrets (repo → Settings → Actions → Secrets):
#   REGISTRY_HOST / REGISTRY_USER / REGISTRY_PASSWORD
name: registry images

on:
  push:
    branches: [main]
    paths:
      - "pkg/**"
      - "cmd/**"
      - "docker/**"
      - ".gitea/workflows/registry-images.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: toolbox
            dockerfile: docker/Dockerfile.toolbox
            tag: toolbox
            go_image: golang:1.27-alpine
            runtime_image: alpine:3.24
            build_args: ""
          - name: poder
            dockerfile: docker/Dockerfile.poder
            tag: poder
            go_image: golang:1.27-alpine
            runtime_image: alpine:3.24
            build_args: ""
          - name: desktop
            dockerfile: docker/Dockerfile.desktop
            tag: desktop
            go_image: golang:1.27-bookworm
            runtime_image: ubuntu:22.04
            build_args: ""
          # Same image at 1024x640 for a capped uplink (~40% fewer pixels). Built
          # here so the "light" tier the console offers is a published image, not
          # something only the maintainer's machine had.
          - name: desktop-small
            dockerfile: docker/Dockerfile.desktop
            tag: desktop-small
            go_image: golang:1.27-bookworm
            runtime_image: ubuntu:22.04
            build_args: "--build-arg DESKTOP_GEOMETRY=1024x640"
    steps:
      - name: checkout
        env:
          TOKEN: ${{ github.token }}
          SERVER: ${{ github.server_url }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          # SERVER is the runner's internal address (http://gitea:3000 on this
          # Gitea, https://host elsewhere). Keep its scheme: hardcoding https
          # against the HTTP port fails the TLS handshake.
          proto="${SERVER%%://*}"
          host="${SERVER#*://}"; host="${host%/}"
          git -c http.sslVerify=false clone --depth 1 \
            "${proto}://oauth2:${TOKEN}@${host}/${REPO}.git" src
          cd src && git log --oneline -1

      - name: build and push ${{ matrix.name }}
        env:
          REGISTRY_HOST: ${{ secrets.REGISTRY_HOST }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          set -eu
          cd src
          if [ -z "${REGISTRY_HOST:-}" ]; then
            echo "REGISTRY_HOST is not set — skipping the publish, build only"
          fi
          if [ -n "${REGISTRY_HOST:-}" ]; then
            printf '%s' "$REGISTRY_PASSWORD" | docker login "$REGISTRY_HOST" -u "$REGISTRY_USER" --password-stdin
          fi
          IMG="${REGISTRY_HOST:-local}/sandrpod/${{ matrix.tag }}"
          # Base images come from our own registry: the CI host cannot pull from
          # Docker Hub (a golang:1.27-alpine pull sat for 45 minutes and then died
          # with "connection reset by peer"). We mirror the four bases we use.
          BASE="${REGISTRY_HOST:-local}/sandrpod-base"
          docker build \
            --build-arg GO_IMAGE="${BASE}/${{ matrix.go_image }}" \
            --build-arg RUNTIME_IMAGE="${BASE}/${{ matrix.runtime_image }}" \
            ${{ matrix.build_args }} \
            -f "${{ matrix.dockerfile }}" -t "$IMG:latest" .
          if [ -n "${REGISTRY_HOST:-}" ]; then
            docker tag "$IMG:latest" "$IMG:main-${GITHUB_SHA:-unknown}"
            docker push "$IMG:main-${GITHUB_SHA:-unknown}"
            docker push "$IMG:latest"
          fi
