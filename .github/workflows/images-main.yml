# Build and publish the runtime images on every push to main.
#
# The v* tag release already publishes them (release.yml), but a tag is a
# release decision — and the fixes that matter most are the ones that never get
# a tag: a toolbox bug, a proxy fix. Without this workflow those fixes reach
# nobody until someone remembers to rebuild by hand, and "the code says it is
# fixed but the container still misbehaves" is a failure mode that costs hours.
#
#   :latest       what a deployment should run
#   :main-<sha>   what this commit produced, for pinning and rollback
name: images (main)

on:
  push:
    branches: [main]
    paths:
      - "pkg/toolbox/**"
      - "pkg/poder/**"
      - "pkg/egress/**"
      - "pkg/relay/**"
      - "cmd/toolbox/**"
      - "cmd/poder/**"
      - "cmd/egress-proxy/**"
      - "cmd/agent/**"
      - "docker/**"
      - ".github/workflows/images-main.yml"

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: toolbox
            dockerfile: docker/Dockerfile.toolbox
          - name: poder
            dockerfile: docker/Dockerfile.poder
          - name: egress-proxy
            dockerfile: docker/Dockerfile.egress
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:latest
            ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:main-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
