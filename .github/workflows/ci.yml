name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # sandrpod-tray uses getlantern/systray, which needs CGO + GTK headers
      # on Linux — without these, `go build ./...` fails on cmd/sandrpod-tray.
      - name: Install GTK headers (sandrpod-tray)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libgtk-3-dev libayatana-appindicator3-dev

      - name: Verify dependencies
        run: go mod verify

      # Before vet, because a formatting failure is cheap to produce and cheap
      # to fix, and there is no reason to spend a build on it. Four files sat
      # unformatted in the tree until someone noticed by hand — vet and the
      # tests never had an opinion about it.
      - name: Format
        run: |
          unformatted=$(gofmt -l ./cmd ./pkg)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt'd:"
            echo "$unformatted"
            echo
            gofmt -d ./cmd ./pkg
            exit 1
          fi

      - name: Pinned versions agree
        # Catches a release that bumped the compose file and forgot the eight
        # provider guides — which is how they sat four releases behind.
        run: ./scripts/check-versions.sh

      - name: Vet
        run: go vet ./...

      - name: Build
        run: go build ./...

      - name: Test (with race detector)
        run: go test -race -timeout 300s ./...

      - name: Cross-compile agent (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o /dev/null ./cmd/agent

      - name: Cross-compile agent (linux/arm64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 \
            go build -ldflags="-s -w" -o /dev/null ./cmd/agent

      - name: Cross-compile server (linux/amd64)
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -ldflags="-s -w" -o /dev/null ./cmd/server
