# Server + Poder + PostgreSQL (production / multi-instance backend).
# Pulls the published GHCR images.
#   docker compose -f docker/docker-compose.pg.yml up -d
# For the single-instance quickstart (SQLite) use docker-compose.yml. For scaling out,
# see docs/MULTI_INSTANCE_DEPLOYMENT.md — this file is its single-host PostgreSQL
# starting point.

services:
  postgres:
    image: postgres:16-alpine
    container_name: sandrpod-postgres
    environment:
      - POSTGRES_USER=sandrpod
      # Change this before any non-local deployment.
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-sandrpod}
      - POSTGRES_DB=sandrpod
    networks:
      - sandrpod
    volumes:
      - sandrpod-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sandrpod -d sandrpod"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  server:
    image: ghcr.io/sandrpod/server:latest
    container_name: sandrpod-server
    command:
      - "-port=8080"
      - "-db=postgres://sandrpod:${POSTGRES_PASSWORD:-sandrpod}@postgres:5432/sandrpod?sslmode=disable"
    ports:
      - "8080:8080"
    networks:
      - sandrpod
    environment:
      # Optional. Empty = auth disabled (anonymous admin) — localhost only.
      - SANDRPOD_TOKEN=${SANDRPOD_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      # Short interval so the poder's `service_healthy` gate (and
      # `up --wait`) clears in seconds rather than a full 30s cycle.
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 2s

  poder:
    image: ghcr.io/sandrpod/poder:latest
    container_name: sandrpod-poder
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandrpod
    environment:
      - API_URL=http://server:8080
      - REGION=${REGION:-local}
      - PROVIDER_TYPE=${PROVIDER_TYPE:-local}
      - SANDRPOD_TOKEN=${SANDRPOD_TOKEN:-}
      # Create sandbox containers on THIS network so the Poder can reach them
      # (see docker-compose.yml for why).
      - SANDRPOD_NETWORK=sandrpod
      - SANDRPOD_TOOLBOX_IMAGE=${SANDRPOD_TOOLBOX_IMAGE:-ghcr.io/sandrpod/toolbox:latest}
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sandrpod-pgdata:

networks:
  sandrpod:
    name: sandrpod
