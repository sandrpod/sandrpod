# Server + Poder 部署（拉取 GHCR 发布镜像；SQLite 持久化，单实例）。
# 从源码构建请用 docker-compose.local.yml；生产/多实例(PostgreSQL)用 docker-compose.pg.yml。

services:
  server:
    image: ghcr.io/sandrpod/server:latest
    container_name: sandrpod-server
    # SQLite persistence — sandboxes/poders/tokens survive a restart.
    command: ["-port=8080", "-db=sqlite:/data/sandrpod.db"]
    ports:
      - "8080:8080"
    networks:
      - sandrpod
    environment:
      # Optional. Empty = auth disabled (anonymous admin) — localhost only.
      - SANDRPOD_TOKEN=${SANDRPOD_TOKEN:-}
    volumes:
      - sandrpod-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  poder:
    image: ghcr.io/sandrpod/poder:latest
    container_name: sandrpod-poder
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandrpod
    environment:
      - API_URL=http://server:8080
      - REGION=${REGION:-local}
      - PROVIDER_TYPE=${PROVIDER_TYPE:-local}
      - SANDRPOD_TOKEN=${SANDRPOD_TOKEN:-}
      # Create sandbox containers on THIS network so the Poder can reach them.
      # Without it they land on the default bridge, unreachable from here, and
      # code execution hangs.
      - SANDRPOD_NETWORK=sandrpod
      - SANDRPOD_TOOLBOX_IMAGE=${SANDRPOD_TOOLBOX_IMAGE:-ghcr.io/sandrpod/toolbox:latest}
    depends_on:
      - server
    restart: unless-stopped

volumes:
  sandrpod-data:

networks:
  sandrpod:
    name: sandrpod
