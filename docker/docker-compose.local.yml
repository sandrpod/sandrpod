# Copyright 2026 SandrPod Contributors
# Local development — builds every image from source.

services:
  server:
    build:
      context: ..
      dockerfile: docker/Dockerfile.server
    image: sandrpod/server:dev
    platform: linux/amd64
    container_name: sandrpod-server
    command: ["-port=8080", "-db=sqlite:/data/sandrpod.db"]
    ports:
      - "8080:8080"
    networks:
      - sandrpod
    environment:
      - SANDRPOD_TOKEN=${SANDRPOD_TOKEN:-}
    volumes:
      - sandrpod-data-dev:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s

  poder:
    build:
      context: ..
      dockerfile: docker/Dockerfile.poder
    image: sandrpod/poder:dev
    platform: linux/amd64
    container_name: sandrpod-poder
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - sandrpod
    environment:
      - API_URL=http://server:8080
      - REGION=local
      - PROVIDER_TYPE=local
      # Sandbox containers must join THIS network or the Poder can't reach them
      # (see docker-compose.yml). Only server+poder are built from source here;
      # the toolbox image is pulled from GHCR.
      - SANDRPOD_NETWORK=sandrpod
      - SANDRPOD_TOOLBOX_IMAGE=ghcr.io/sandrpod/toolbox:latest
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sandrpod-data-dev:

networks:
  sandrpod:
    name: sandrpod
